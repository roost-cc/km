[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "km"
version = "0.1.0"
description = "Manifest-driven key-management CLI: rotate secrets and publish them to their stores"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "cryptography>=43",
    "ruamel.yaml>=0.18",
    "jsonpath-rfc9535>=2.0.2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-httpx>=0.30",
    "ruff>=0.6",
]

[project.scripts]
km = "km.cli:main"

[tool.setuptools.packages.find]
include = ["km*"]
exclude = ["test*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["*_test.py"]
pythonpath = ["."]
markers = [
    "integration: integration tests (may hit network / subprocess; env-gated)",
]
